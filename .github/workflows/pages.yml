# Publishes the docs application to GitHub Pages: https://ramanacr.github.io/star-ng/
# Runs on every push to main and by hand (Actions, "Pages", "Run workflow").
# One-time repository setting: Settings, Pages, Source: GitHub Actions.
# The test suites are not run here: CI already ran them on the pull request.
# Third-party actions are pinned to full commit SHAs (version in the trailing comment).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job only reads. The deploy job adds the two Pages permissions.
permissions:
  contents: read

# One deployment at a time. A running deployment is never cancelled, so a half-published
# site cannot happen; a newer run waits and replaces it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Outputs `base_path`: "/star-ng" for this repository, "" for a user site or a custom
      # domain. The base href is taken from it, so a fork works without a change.
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The docs use the library from source (tsconfig paths, SCSS), so no package build is needed.
      # build:pages runs `ng build docs --base-href`, then copies index.html to 404.html
      # (single-page-application fallback, see tools/pages-fallback.mjs).
      - name: Build the docs for the sub-path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build:pages "${BASE_PATH}/"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs/browser

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
