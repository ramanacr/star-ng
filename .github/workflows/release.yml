# Release of the npm package `@star-ng/ui`. See RELEASING.md for the steps and the one-time setup.
#
# - Push a tag `v<version>` (for example `v0.1.0`) on a commit of `main`: verify, pack, publish.
# - "Run workflow" by hand (Actions, "Release"): a DRY RUN. It verifies and packs, uploads the
#   tarball as an artifact, and never publishes.
#
# Authentication is npm Trusted Publishing (OIDC): there is NO npm token in this repository.
# Only the `publish` job has `id-token: write`. It runs in the GitHub environment `npm`, only for a
# tag push, and only when the repository variable NPM_PUBLISH is `true`. A tag that is pushed
# before npm is set up therefore does nothing harmful.
#
# The docs build and the Playwright suites (end-to-end, accessibility, visual) are NOT part of the
# release: CI runs them on every pull request and on `main`, and a tag is made on a green `main`.
# Third-party actions are pinned to full commit SHAs (version in the trailing comment).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege for every job. The publish job adds `id-token: write`.
# The job `github-release` adds `contents: write` (it makes the GitHub release after the publish).
# The job `verify-published` checks the package after the publish. It is separate from `publish`,
# so the run shows if the publish worked, and a failed check can be re-run alone (see RELEASING.md).
permissions:
  contents: read

# Two runs for the same ref never run together, and a running release is never cancelled
# (a half-finished publish is worse than a waiting one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      package: ${{ steps.pack.outputs.package }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # Full history: the tag commit is checked to be part of `main`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The tag must be `v` plus the version in projects/star-ng/package.json, and the version
      # must be valid semver. A dry run (no tag) uses the version of the package. The dist-tag is
      # `next` for a version with a prerelease part and `latest` for any other version.
      - name: Check the version and choose the dist-tag
        id: release
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node tools/release-version.mjs "$TAG"

      - name: Check that the tag is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=Tag not on main::The tag $GITHUB_REF_NAME points to a commit that is not on main. Release only from main."
            exit 1
          fi

      - name: Lint (ESLint, docs data, names)
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:ci

      - name: Build library (package and CSS)
        run: pnpm build:lib

      - name: Check the package
        run: pnpm check:package

      - name: Pack the tarball
        id: pack
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack ./dist/star-ng --pack-destination ./release --ignore-scripts
          tarball="star-ng-ui-${VERSION}.tgz"
          test -f "release/${tarball}" || { echo "::error::Expected release/${tarball} was not made."; ls -l release; exit 1; }
          test "$(ls release | wc -l)" = "1" || { echo "::error::The release folder must hold exactly one tarball."; ls -l release; exit 1; }
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package=$(node -p "require('./dist/star-ng/package.json').name")" >> "$GITHUB_OUTPUT"

      # A real Angular application installs the packed tarball and builds for production.
      # It proves that the entry points, typings, peer ranges and style exports resolve.
      - name: Consumer smoke test
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node tools/smoke-consumer.mjs "$PWD/release/${TARBALL}"

      - name: Upload the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: star-ng-tarball
          path: release/*.tgz
          retention-days: 14
          if-no-files-found: error

      - name: Job summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          REF: ${{ github.ref_type == 'tag' && github.ref_name || 'dry run (no tag)' }}
        run: |
          set -euo pipefail
          size=$(stat -c%s "release/${TARBALL}")
          files=$(tar -tzf "release/${TARBALL}" | wc -l)
          {
            echo "## Release check: @star-ng/ui ${VERSION}"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Dist-tag | \`${DIST_TAG}\` |"
            echo "| Trigger | ${REF} |"
            echo "| Tarball | \`${TARBALL}\` |"
            echo "| Tarball size | $((size / 1024)) kB |"
            echo "| Files in the tarball | ${files} |"
            echo
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "The publish job runs next if the repository variable \`NPM_PUBLISH\` is \`true\`."
            else
              echo "Dry run: nothing is published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish to npm
    needs: verify
    # Only for a tag push (never a manual run), and only when npm is set up.
    if: github.event_name == 'push' && github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: star-ng-tarball
          path: release

      # Trusted Publishing needs npm 11.5.1 or later. Node 22 ships npm 10.
      - name: Install a current npm
        run: |
          npm install -g npm@11.20.0
          npm --version

      # The tarball path starts with `./`: without it npm reads `release/x.tgz` as GitHub shorthand.
      # This is the only place in the repository that runs `npm publish`.
      - name: Publish with provenance
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          test -f "./release/${TARBALL}"
          npm publish "./release/${TARBALL}" --access public --provenance --tag "${DIST_TAG}"
          {
            echo "## Published @star-ng/ui ${VERSION}"
            echo
            echo "Dist-tag: \`${DIST_TAG}\`. Package page: https://www.npmjs.com/package/@star-ng/ui/v/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Checks the version that `publish` made. Read-only: no id-token and no environment. It never
  # publishes, so "Re-run failed jobs" or "Re-run job" on this job alone is always safe.
  verify-published:
    name: verify published package
    needs: [verify, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install a current npm
        run: |
          npm install -g npm@11.20.0
          npm --version

      # A new version can need some minutes before the registry answers for it ("Your package is
      # being processed"). Poll the metadata of the exact version first, with a growing delay
      # (5 s, doubled up to 60 s) and a total budget of 15 minutes (POLL_BUDGET_SECONDS).
      - name: Wait for the version in the registry
        env:
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
          POLL_BUDGET_SECONDS: '900'
        run: |
          set -euo pipefail
          spec="${PACKAGE}@${VERSION}"
          start=$SECONDS
          delay=5
          attempt=1
          until npm view "$spec" version --prefer-online > /dev/null 2>&1; do
            elapsed=$((SECONDS - start))
            if [ "$elapsed" -ge "$POLL_BUDGET_SECONDS" ]; then
              echo "::error title=Version not in the registry::${spec} did not appear in the npm registry within ${POLL_BUDGET_SECONDS} seconds. The job 'publish to npm' (job id: publish) of this run succeeded, so the publish may be fine and the registry may only be slow. Do NOT re-run the publish job: a version can be published only once. Check 'npm view ${spec} version', then re-run only the job 'verify published package' (verify-published)."
              exit 1
            fi
            echo "${spec} is not available yet (attempt ${attempt}, ${elapsed} s of ${POLL_BUDGET_SECONDS} s). Waiting ${delay} seconds."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2 > 60 ? 60 : delay * 2))
          done
          echo "${spec} is available after $((SECONDS - start)) s (attempt ${attempt})."

      # Installs the published version into an empty project and checks the registry signature and
      # the provenance attestation. `--ignore-scripts --legacy-peer-deps --no-audit --no-fund`:
      # the Angular peer dependencies are not installed and no script runs.
      - name: Verify signature and provenance
        env:
          PACKAGE: ${{ needs.verify.outputs.package }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir scratch
          cd scratch
          npm init -y > /dev/null
          npm install "${PACKAGE}@${VERSION}" --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm audit signatures | tee audit.txt
          # npm 11 prints "1 package has a verified attestation" or "N packages have verified attestations".
          if ! grep -Eq "verified attestations?" audit.txt; then
            echo "::error::npm audit signatures reports no verified provenance attestation."
            exit 1
          fi
          {
            echo "## Verified ${PACKAGE} ${VERSION}"
            echo
            echo "\`npm audit signatures\`:"
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Makes the GitHub release for the tag, with the changelog section of the version as notes.
  # It runs only after `publish` succeeded: a run with NPM_PUBLISH not `true` (publish is
  # skipped) or a failed publish makes no release. It does not wait for `verify-published`: a
  # slow registry must not block the release, and the notes do not depend on it.
  # It never publishes to npm. It is the only job with `contents: write`.
  # A re-run is safe: if the release exists, the job does nothing (it never edits a release).
  github-release:
    name: create GitHub release
    needs: [verify, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and tags: the job compares the tag with the other version tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail

          # Fails (and so stops the job) if the changelog section is missing or empty.
          node tools/release-notes.mjs "$VERSION" > release-notes.md

          # Idempotent: an existing release is left as it is. Any other error of `gh` fails the job.
          if view=$(gh release view "$TAG" 2>&1); then
            echo "The release $TAG exists already. Nothing to do."
            echo "The release $TAG exists already: skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q "release not found" <<< "$view"; then
            echo "::error title=Cannot read the release::$view"
            exit 1
          fi

          # `--latest` only for the highest stable version (no prerelease part). An older version
          # made later (a patch of an old line) and a prerelease are not marked as latest.
          flags=(--verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          else
            highest=$(git tag --list 'v[0-9]*' | grep -Ev -- '-' | sort -V | tail -n 1)
            if [ "$highest" = "$TAG" ]; then
              flags+=(--latest)
            else
              flags+=(--latest=false)
            fi
          fi

          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          echo "Created the release $TAG: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
