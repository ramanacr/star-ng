<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StarNG</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="StarNG: accessible Angular controls built on signals." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // First-paint theme script of star-ng/theme (see the "Dark mode" guide): sets the theme
      // before the first paint, so a dark-theme user does not see a light frame.
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('star-theme') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
