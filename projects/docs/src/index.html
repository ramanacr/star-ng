<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StarNG</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="StarNG: accessible Angular controls built on signals." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!--
      Content Security Policy of the docs application (see the "Content Security Policy" section
      of the "Dark mode" guide). No inline script: the first-paint theme script is the static file
      star-theme-first-paint.js of @star-ng/ui/theme, copied into the build by angular.json.
      docs-direction-first-paint.js (projects/docs/public) does the same for a saved right-to-left
      choice.
      'unsafe-inline' stays in style-src only, because Angular adds each component style as an
      inline style element and the examples use style attributes.
      script-src-attr allows only the hash of the text alert(1): the Editor page shows how the
      sanitizer removes a hostile onclick="alert(1)", and Angular's sanitizer reports a policy
      violation when it parses that attribute (the handler never runs). No other inline event
      handler is allowed.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; script-src-attr 'unsafe-hashes' 'sha256-bhHHL3z2vDgxUt0W3dWQOrprscmda2Y5pLsLg4GF+pI='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <script src="star-theme-first-paint.js"></script>
    <script src="docs-direction-first-paint.js"></script>
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
